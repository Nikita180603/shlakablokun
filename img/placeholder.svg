<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Фото товара скоро появится">
  <rect width="1200" height="900" fill="#f4efe7"/>
  <g stroke="#d9d1c3" stroke-width="3">
    <rect x="150" y="170" width="270" height="180" fill="#8d8d86"/>
    <rect x="450" y="170" width="270" height="180" fill="#9d3b32"/>
    <rect x="750" y="170" width="270" height="180" fill="#6d4b34"/>
    <rect x="150" y="380" width="270" height="180" fill="#c6a15b"/>
    <rect x="450" y="380" width="270" height="180" fill="#3e4246"/>
    <rect x="750" y="380" width="270" height="180" fill="#a89880"/>
  </g>
  <text x="600" y="690" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="46" font-weight="700" fill="#1b1916">Фото скоро появится</text>
  <text x="600" y="745" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="30" fill="#6b6560">Уточните фактуру и цвет у менеджера</text>
